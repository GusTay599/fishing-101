# Render deployment config for the backend API
# https://render.com/docs/deploy-to-render

services:
  - type: web
    name: fishing-101-api
    env: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build:server
    startCommand: npx tsx src/server/index.ts
    disk:
      name: fishing-101-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: CLIENT_URL
        value: https://fishing-101.co.uk
      - key: DATABASE_PATH
        value: /data/fishing-catches.db
    healthCheckPath: /health
    autoDeploy: true
